[project]
name = "pv_hochlauf"
version = "0.1.0"
description = "PV-Hochlauf Modellierung"
readme = "README.md"
authors = [
    { email = "jan.koertgen@alumni.fh-aachen.de" }
]
requires-python = ">=3.11"
dependencies = [
    "ethos-builda-client",
    "fastparquet>=2026.5.0",
    "joblib>=1.6.0",
    "matplotlib>=3.11.1",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "psycopg2>=2.9.12",
    "pyarrow>=25.0.1",
    "scipy>=1.17.1",
    "tqdm>=4.70.0",
]

[project.scripts]
hochlaufszenarien = "pv_hochlauf.pv_hochlauf_main:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
ethos-builda-client = { git = "https://github.com/FZJ-IEK3-VSA/ethos-builda-client.git" }
