[project]
name = "pv_hochlauf"
version = "0.1.0"
description = "AP 3.1 PV-Hochlaufszenarien (SIMU-FLEX LOKAL) — probabilistisches Diffusions-Ensemble + BUILDA-Dachsättigung"
readme = "README.md"
authors = [
    { name = "NOWUM-Energy, FH Aachen" },
]
requires-python = ">=3.11"
dependencies = [
    "ethos-builda-client",
    "fastparquet>=2026.5.0",
    "joblib>=1.6.0",
    "matplotlib>=3.11.1",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "psycopg2-binary>=2.9.12",
    "pyarrow>=25.0.1",
    "scipy>=1.17.1",
    "tqdm>=4.70.0",
]

[project.scripts]
pv-hochlauf = "pv_hochlauf.pv_hochlauf_main:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pv_hochlauf"
module-root = ""

[tool.uv.sources]
ethos-builda-client = { git = "https://github.com/FZJ-IEK3-VSA/ethos-builda-client.git" }

[dependency-groups]
dev = [
    "jupyterlab>=4.6.5",
]
